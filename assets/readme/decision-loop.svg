<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">从市场信号到经营动作的决策闭环</title>
  <desc id="desc">发现变化、核验证据、明确取舍、进入经营四个阶段</desc>
  <rect width="960" height="520" rx="28" fill="#FAFAF7"/>

  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="54" y="66" fill="#C7372F" font-size="20" font-weight="700" letter-spacing="2">DECISION LOOP</text>
    <text x="54" y="122" fill="#0C2240" font-size="42" font-weight="800">每个结论都要走完四步</text>

    <g transform="translate(54 164)">
      <rect width="404" height="136" rx="18" fill="#0C2240"/>
      <text x="24" y="44" fill="#C6D3D6" font-size="18" font-weight="700" letter-spacing="2">01 / SIGNAL</text>
      <text x="24" y="94" fill="#FFFFFF" font-size="34" font-weight="800">发现变化</text>
    </g>
    <g transform="translate(502 164)">
      <rect width="404" height="136" rx="18" fill="#E4E9E9"/>
      <text x="24" y="44" fill="#405967" font-size="18" font-weight="700" letter-spacing="2">02 / EVIDENCE</text>
      <text x="24" y="94" fill="#0C2240" font-size="34" font-weight="800">核验证据</text>
    </g>
    <g transform="translate(54 324)">
      <rect width="404" height="136" rx="18" fill="#E4E9E9"/>
      <text x="24" y="44" fill="#405967" font-size="18" font-weight="700" letter-spacing="2">03 / DECISION</text>
      <text x="24" y="94" fill="#0C2240" font-size="34" font-weight="800">明确取舍</text>
    </g>
    <g transform="translate(502 324)">
      <rect width="404" height="136" rx="18" fill="#C7372F"/>
      <text x="24" y="44" fill="#FFF1EF" font-size="18" font-weight="700" letter-spacing="2">04 / ACTION</text>
      <text x="24" y="94" fill="#FFFFFF" font-size="34" font-weight="800">进入经营</text>
    </g>

    <path d="M458 232 H502" stroke="#C7372F" stroke-width="5" stroke-linecap="round"/>
    <path d="M704 300 V324" stroke="#C7372F" stroke-width="5" stroke-linecap="round"/>
    <path d="M502 392 H458" stroke="#C7372F" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
