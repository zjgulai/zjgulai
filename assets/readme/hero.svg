<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Pray Chow：把市场信号变成经营动作</title>
  <desc id="desc">面向中国跨境品牌管理层的可核验 AI 决策系统</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAF7"/>
      <stop offset="1" stop-color="#F0F3F3"/>
    </linearGradient>
    <radialGradient id="signal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#DCE5E7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#DCE5E7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="520" rx="28" fill="url(#field)"/>
  <circle cx="808" cy="142" r="205" fill="url(#signal)"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="54" y="55" fill="#0C2240" font-size="20" font-weight="700" letter-spacing="2">PRAY CHOW · AI STRATEGY &amp; DECISION SYSTEMS</text>
    <text x="54" y="158" fill="#0C2240" font-size="58" font-weight="800">把市场信号</text>
    <text x="54" y="226" fill="#0C2240" font-size="58" font-weight="800">变成经营动作</text>
    <text x="54" y="276" fill="#4A6170" font-size="24" font-weight="500">为中国跨境品牌构建可核验、可治理、可持续运营的 AI 决策系统</text>

    <g transform="translate(54 330)">
      <rect width="250" height="132" rx="18" fill="#0C2240"/>
      <text x="24" y="58" fill="#FFFFFF" font-size="44" font-weight="800">11 年</text>
      <text x="24" y="96" fill="#D9E2E4" font-size="21" font-weight="600">数据科学与算法</text>
    </g>
    <g transform="translate(322 330)">
      <rect width="250" height="132" rx="18" fill="#E4E9E9"/>
      <text x="24" y="58" fill="#0C2240" font-size="44" font-weight="800">164 项</text>
      <text x="24" y="96" fill="#324B5B" font-size="21" font-weight="600">可治理 Skills</text>
    </g>
    <g transform="translate(590 330)">
      <rect width="316" height="132" rx="18" fill="#C7372F"/>
      <text x="24" y="58" fill="#FFFFFF" font-size="44" font-weight="800">81 项</text>
      <text x="24" y="96" fill="#FFF1EF" font-size="21" font-weight="600">Hook 自动化测试</text>
    </g>

    <path d="M666 250 C728 184 797 268 888 145" fill="none" stroke="#C7372F" stroke-width="6" stroke-linecap="round"/>
    <circle cx="666" cy="250" r="10" fill="#0C2240"/>
    <circle cx="772" cy="219" r="10" fill="#C7372F"/>
    <circle cx="888" cy="145" r="12" fill="#0C2240"/>
