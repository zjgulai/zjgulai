<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">路特 AI 跨境品牌能力矩阵</title>
  <desc id="desc">市场洞察、品牌诊断、AI 内容生产、Agent 与知识基础设施四类能力</desc>
  <rect width="1200" height="640" rx="28" fill="#FAFAF7"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="64" y="58" fill="#C7372F" font-size="15" font-weight="700" letter-spacing="2">CAPABILITY MAP</text>
    <text x="64" y="104" fill="#0C2240" font-size="34" font-weight="800">跨境品牌的 AI 能力组合</text>

    <rect x="64" y="144" width="526" height="196" rx="18" fill="#0C2240"/>
    <text x="96" y="203" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="2">01 / INSIGHT</text>
    <text x="96" y="268" fill="#FFFFFF" font-size="26" font-weight="800">市场与消费者洞察</text>

    <rect x="610" y="144" width="526" height="196" rx="18" fill="#E8EDEF"/>
    <text x="642" y="203" fill="#607685" font-size="15" font-weight="700" letter-spacing="2">02 / DIAGNOSIS</text>
    <text x="642" y="268" fill="#0C2240" font-size="26" font-weight="800">品牌经营诊断</text>

    <rect x="64" y="360" width="526" height="196" rx="18" fill="#E8EDEF"/>
    <text x="96" y="419" fill="#607685" font-size="15" font-weight="700" letter-spacing="2">03 / PRODUCTION</text>
    <text x="96" y="484" fill="#0C2240" font-size="26" font-weight="800">AI 内容生产</text>

    <rect x="610" y="360" width="526" height="196" rx="18" fill="#C7372F"/>
    <text x="642" y="419" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="2">04 / INFRASTRUCTURE</text>
    <text x="642" y="484" fill="#FFFFFF" font-size="26" font-weight="800">Agent 与知识基础设施</text>
  </g>
</svg>
